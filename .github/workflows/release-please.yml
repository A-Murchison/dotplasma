name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR or GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Generate release app token
        id: release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          npx --yes release-please@17.11.2 release-pr \
            --token "${GITHUB_TOKEN}" \
            --repo-url "${GITHUB_REPOSITORY}" \
            --target-branch "${GITHUB_REF_NAME}" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json

          npx --yes release-please@17.11.2 github-release \
            --token "${GITHUB_TOKEN}" \
            --repo-url "${GITHUB_REPOSITORY}" \
            --target-branch "${GITHUB_REF_NAME}" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json
